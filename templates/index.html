<!DOCTYPE html>
<html>

<head>

    <title>Password Strength Analyzer</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 80px;
        }

        .box {
            background-color: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 10px;
        }

        button {
            padding: 12px 25px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .result {
            margin-top: 20px;
        }
    </style>

</head>


<body>

    <div class="box">

        <h1>Password Strength Analyzer</h1>

        <form method="POST">

            <input type="password" name="password" placeholder="Enter password" required>

            <br>

            <button type="submit">
                Check Password
            </button>

        </form>


        {% if strength %}

        <div class="result">

            <h2>Strength: {{ strength }}</h2>

            {% if suggestions %}

            <h3>Suggestions:</h3>

            <ul>

                {% for suggestion in suggestions %}

                <li>{{ suggestion }}</li>

                {% endfor %}

            </ul>

            {% else %}

            <p>
                Your password meets all the basic requirements!
            </p>

            {% endif %}

        </div>

        {% endif %}

    </div>

</body>

</html>
